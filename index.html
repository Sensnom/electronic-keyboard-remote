<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>60K 琴曲练习</title><link rel="stylesheet" href="./styles.css"></head>
<body><main><header><p class="device">电子琴练习</p><h1 id="page-title">曲目上传</h1><p id="page-description">选择曲目，跟随琴上的提示练习。</p><div id="connection" role="status">尚未连接乐器</div></header><nav class="page-nav" aria-label="页面"><a id="nav-upload" href="./index.html" aria-current="page">曲目上传</a><a id="nav-parameters" href="./parameters.html">演奏参数</a><a id="nav-logs" href="./logs.html">信号日志</a></nav>
<section class="connection-section"><details id="connection-settings" open><summary>连接乐器</summary>
<label for="broker">MQTT WSS 地址</label><input id="broker" type="url" value="wss://broker.emqx.io:8084/mqtt" spellcheck="false" autocomplete="off">
<div class="controls topics"><div><label for="up-topic">设备上行主题</label><input id="up-topic" type="text" value="tof/flowmeter/data" spellcheck="false" maxlength="256"></div><div><label for="down-topic">设备下行主题</label><input id="down-topic" type="text" value="tof/flowmeter/down" spellcheck="false" maxlength="256"></div></div>
<details><summary>账号与传输设置</summary><div class="controls"><div><label for="username">MQTT 用户名（可选）</label><input id="username" type="text" autocomplete="off"></div><div><label for="password">MQTT 密码（可选）</label><input id="password" type="password" autocomplete="off"></div></div><label for="qos">MQTT QoS</label><select id="qos"><option value="0">0</option><option value="1">1</option></select></details>
<div class="actions"><button id="connect">连接并检查乐器</button><button id="disconnect" class="secondary" disabled>断开连接</button></div>
</details></section>
<section id="upload-page" aria-labelledby="song-title"><h2 id="song-title">选择曲目</h2><label class="file-pick" for="file">选择手机里的 MIDI 文件<input id="file" type="file" accept=".mid,.midi,audio/midi"></label><p id="file-info" class="hint">尚未选择文件。</p><fieldset id="tracks"><legend>选择练习轨道</legend><p class="hint">选择文件后，勾选需要练习的旋律轨道。</p></fieldset><label for="speed">练习速度 <output id="speed-value">100%</output></label><input id="speed" type="range" min="10" max="300" step="1" value="100"><label for="speed-number">速度百分比</label><input id="speed-number" type="number" min="10" max="300" step="1" value="100" inputmode="numeric"><div class="actions" aria-label="快捷速度"><button type="button" class="secondary" data-speed="25">25%</button><button type="button" class="secondary" data-speed="50">50%</button><button type="button" class="secondary" data-speed="75">75%</button><button type="button" class="secondary" data-speed="100">100%</button><button type="button" class="secondary" data-speed="150">150%</button><button type="button" class="secondary" data-speed="200">200%</button><button type="button" class="secondary" data-speed="300">300%</button></div><p class="hint">修改速度后需重新上传。</p><p id="summary" class="hint">音区会跟随曲目自动换八度，保持原来的音高。</p><div class="actions"><button id="upload" disabled>上传练习曲</button><button id="builtin" class="secondary">使用内置《小星星》</button></div><progress id="progress" max="100" value="0" aria-label="上传进度"></progress><p id="result" role="status" aria-live="polite"></p><p class="hint">上传后短按琴上按钮9开始练习。</p></section>
<section id="parameters-page" aria-labelledby="controls-title" hidden><h2 id="controls-title">演奏参数</h2>
<div class="actions"><button id="read-settings" class="secondary" disabled>读取乐器设置</button></div>
<fieldset class="parameter-group" data-params="1,2"><legend>音色与音量</legend><div class="controls"><div><label for="volume">音量 <output id="volume-value">100%</output></label><input id="volume" type="range" min="0" max="100" value="100" data-parameter="1"></div><div><label for="patch">音色</label><select id="patch" data-parameter="2"><option value="0">钢琴</option><option value="1">吉他</option><option value="2">电子鼓</option><option value="4">马林巴</option></select></div></div></fieldset>
<fieldset class="parameter-group" data-params="5,6"><legend>和弦</legend><div class="controls"><div><label for="chord-enabled">演奏模式</label><select id="chord-enabled" data-parameter="5"><option value="0">普通演奏</option><option value="1">和弦演奏</option></select></div><div><label for="chord-type">和弦类型</label><select id="chord-type" data-parameter="6"><option value="0">大三和弦</option><option value="1">小三和弦</option><option value="2">挂二和弦</option><option value="3">挂四和弦</option><option value="4">属七和弦</option><option value="5">大七和弦</option><option value="6">小七和弦</option><option value="7">减三和弦</option></select></div></div></fieldset>
<fieldset class="parameter-group" data-params="7,8,9"><legend>音区与衔接</legend><label for="transpose">半音移调 <output id="transpose-value">0</output></label><input id="transpose" type="range" min="-12" max="12" value="0" step="1" data-parameter="7"><div class="controls"><div><label for="octave">八度</label><select id="octave" data-parameter="8"><option value="-2">降低两个八度</option><option value="-1">降低一个八度</option><option value="0" selected>原八度</option><option value="1">升高一个八度</option><option value="2">升高两个八度</option></select></div><div><label for="glide">滑音</label><select id="glide" data-parameter="9"><option value="0">关闭</option><option value="1">开启</option></select></div></div></fieldset>
<fieldset class="parameter-group" data-params="3,4"><legend>效果</legend><div class="controls"><div><label for="effect">效果类别</label><select id="effect" data-parameter="3"><option value="0">关闭</option><option value="1">混响</option><option value="2">延迟</option><option value="3">合唱</option></select></div><div><label for="wet">效果量 <output id="wet-value">0%</output></label><input id="wet" type="range" min="0" max="100" value="0" data-parameter="4"></div></div></fieldset>
<fieldset class="parameter-group" data-params="12"><legend>学习辅助</legend><label for="sustain">手动延音</label><select id="sustain" data-parameter="12"><option value="0">关闭</option><option value="1">开启</option></select><p class="hint">开启后松键延音，关闭后释放。重复同音需重新按键。</p></fieldset><fieldset id="phone-loop" hidden><legend>Loop 与学习</legend><p id="loop-state" role="status">尚未读取状态</p><div class="actions"><button type="button" data-loop="record">录制 / 结束</button><button type="button" class="secondary" data-loop="undo">撤销最新层</button><button type="button" data-loop="play" id="loop-play">播放 / 停止</button><button type="button" class="secondary" data-loop="clear">清空 Loop</button></div></fieldset><fieldset id="phone-bend" class="parameter-group" data-params="11"><legend>压力弯音</legend><label for="bend-range">滑动调节音高 <output id="bend-value">0.00 半音</output></label><input id="bend-range" type="range" min="-512" max="512" step="1" value="0" aria-label="临时弯音，松开回零"><div class="actions"><button type="button" data-bend="-512">按住降低音高</button><button type="button" data-bend="512">按住升高音高</button></div><p class="hint">松开回到原音高。</p></fieldset><p id="parameter-result" role="status" aria-live="polite"></p></section></main><script type="module" src="./app.mjs"></script></body></html>
